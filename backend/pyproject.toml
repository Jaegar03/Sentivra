[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentivra-backend"
version = "0.1.0"
description = "SENTIVRA — multi-layer cybersecurity detection platform (backend)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# NOTE: dependencies are added incrementally, phase by phase, on purpose —
# see docs/architecture.md. Adding unused heavyweight ML deps (torch,
# transformers) before a phase actually needs them makes installs slow and
# hides real dependency drift. Phase 5 (network ML) and Phase 4's optional
# transformer tier add to this list when that code lands.
dependencies = [
    # Web framework / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Persistence
    "sqlalchemy>=2.0",
    # Outbound HTTP (SSRF-guarded client, integrations)
    "httpx>=0.27",
    # File / malware detection (Phase 3)
    "yara-python>=4.5.0",
    "numpy>=1.26",
    # Text / URL detection (Phase 4)
    "scikit-learn>=1.5",   # HashingVectorizer is needed at inference to rebuild features
    "lightgbm>=4.3",       # URL model; saved in LightGBM's own text format, not pickle
    "regex>=2024.5",       # pattern rules run with a per-match timeout (ReDoS guard)
    "tldextract>=5.1",     # registered-domain extraction from the bundled Public Suffix List
    "pyyaml>=6.0",         # rule packs under detection-rules/ (yaml.safe_load only)
    # Network anomaly detection (Phase 5)
    "onnxruntime>=1.18",   # serves the Isolation Forest and autoencoder exported to ONNX
    "scapy>=2.6",          # PCAP parsing for the upload demo (GPL-2.0, used as a library)
    # API authentication (Phase 10)
    "pyjwt>=2.8",          # signed access tokens for the OAuth2 client-credentials grant
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "bandit>=1.7",         # static security analysis
    "pip-audit>=2.7",      # known-vulnerability audit of dependencies
]
# Training/evaluation scripts under research/. Not needed to run the backend.
research = [
    "pandas>=2.2",
    "skl2onnx>=1.17",      # export scikit-learn models to ONNX
    "onnx>=1.16",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query()/etc. are idiomatically used as argument
# defaults — that's the framework's documented pattern, not a bug.
ignore = ["B008"]
