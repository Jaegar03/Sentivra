{
  "platform": "all",
  "version": "5.0.0",
  "discovery": [],
  "queries": {
    "sentivra_process_events": {
      "query": "SELECT pe.pid, pe.parent, pe.path, pe.cmdline, pe.uid, pe.time, p.name AS parent_name, p.path AS parent_path, h.sha256 FROM process_events pe LEFT JOIN processes p ON p.pid = pe.parent LEFT JOIN hash h ON h.path = pe.path;",
      "interval": 60,
      "platform": "linux,darwin",
      "removed": false,
      "description": "Process starts (requires --audit_allow_process_events / EndpointSecurity). Parent name/path joined from processes; sha256 from the hash table."
    },
    "sentivra_process_etw_events": {
      "query": "SELECT pe.pid, pe.ppid AS parent, pe.path, pe.cmdline, pe.username, pe.time, p.name AS parent_name, p.path AS parent_path, a.result AS signature_result FROM process_etw_events pe LEFT JOIN processes p ON p.pid = pe.ppid LEFT JOIN authenticode a ON a.path = pe.path WHERE pe.type = 'ProcessStart';",
      "interval": 60,
      "platform": "windows",
      "removed": false,
      "description": "Process starts via ETW (requires --enable_process_etw_events). Authenticode result gives signature status."
    },
    "sentivra_socket_events": {
      "query": "SELECT pid, path, action, remote_address, remote_port, local_port, protocol, time FROM socket_events WHERE action = 'connect' AND remote_address NOT IN ('', '127.0.0.1', '::1');",
      "interval": 60,
      "platform": "linux,darwin",
      "removed": false,
      "description": "Outbound connections by process."
    },
    "sentivra_process_open_sockets": {
      "query": "SELECT s.pid, p.path, s.remote_address, s.remote_port, s.local_port, s.protocol FROM process_open_sockets s JOIN processes p USING (pid) WHERE s.remote_port != 0 AND s.remote_address NOT IN ('', '0.0.0.0', '127.0.0.1', '::', '::1');",
      "interval": 120,
      "platform": "windows",
      "removed": false,
      "description": "Open remote connections by process (differential: 'added' rows are new connections)."
    },
    "sentivra_listening_ports": {
      "query": "SELECT lp.pid, lp.port, lp.protocol, lp.address, p.path FROM listening_ports lp LEFT JOIN processes p USING (pid) WHERE lp.port != 0;",
      "interval": 300,
      "removed": false,
      "description": "Listening sockets (differential: 'added' rows are newly opened listeners)."
    },
    "sentivra_file_events": {
      "query": "SELECT target_path, action, sha256, uid, time FROM file_events;",
      "interval": 60,
      "platform": "linux,darwin",
      "removed": false,
      "description": "File creation/modification under the paths listed in the osquery config's file_paths."
    },
    "sentivra_startup_items": {
      "query": "SELECT name, path, args, type, source, status, username FROM startup_items;",
      "interval": 600,
      "removed": false,
      "description": "Autostart entries (Run keys, startup folders, login items, systemd/init)."
    },
    "sentivra_scheduled_tasks": {
      "query": "SELECT name, action, path, enabled FROM scheduled_tasks;",
      "interval": 600,
      "platform": "windows",
      "removed": false,
      "description": "Windows scheduled tasks."
    },
    "sentivra_services": {
      "query": "SELECT name, display_name, path, start_type, user_account FROM services;",
      "interval": 600,
      "platform": "windows",
      "removed": false,
      "description": "Windows services."
    },
    "sentivra_crontab": {
      "query": "SELECT event, minute, hour, command, path FROM crontab;",
      "interval": 600,
      "platform": "linux,darwin",
      "removed": false,
      "description": "Cron entries."
    },
    "sentivra_windows_security_log": {
      "query": "SELECT eventid, datetime, data FROM windows_eventlog WHERE channel = 'Security' AND eventid IN (4624, 4625, 4720, 4732, 1102);",
      "interval": 60,
      "platform": "windows",
      "removed": false,
      "description": "Logon success/failure, account creation, privileged group changes, audit log cleared."
    },
    "sentivra_last": {
      "query": "SELECT username, tty, type, time, host FROM last WHERE type = 7;",
      "interval": 300,
      "platform": "linux,darwin",
      "removed": false,
      "description": "Successful interactive logins (wtmp). Failed logins come from auth logs via the log endpoint."
    }
  }
}
