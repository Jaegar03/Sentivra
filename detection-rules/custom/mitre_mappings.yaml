# SENTIVRA — MITRE ATT&CK / ATLAS mappings used by detectors (brief §31).
#
# Every entry below was checked against MITRE's own published data on
# 2026-09-24:
#   * ATT&CK Enterprise — technique pages at https://attack.mitre.org/techniques/
#   * ATLAS v5.6.0       — https://github.com/mitre-atlas/atlas-data (dist/ATLAS.yaml)
#
# Prompt-injection techniques are not part of ATT&CK; they live in MITRE
# ATLAS, the sibling framework for attacks on AI systems. The `source`
# field says which framework each mapping comes from so an ATLAS ID is
# never presented as an ATT&CK one.
#
# Detectors reference these by key. Findings with no defensible mapping
# (e.g. a high-entropy file on its own) carry no mapping.

sql_injection:
  - technique_id: T1190
    technique_name: Exploit Public-Facing Application
    tactic: Initial Access
    source: MITRE ATT&CK Enterprise (verified 2026-09-24)

phishing_message_link:
